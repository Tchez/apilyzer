name: Pipeline
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Copy files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --without doc

      - name: Run tests
        run: poetry run task test --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Copy files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install audit tools
        run: pip install poetry poetry-plugin-export pip-audit

      - name: Export locked dependencies
        run: poetry export --with dev,doc --without-hashes --output /tmp/apilyzer-requirements.txt

      - name: Audit locked dependencies
        run: pip-audit --requirement /tmp/apilyzer-requirements.txt --no-deps --disable-pip

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Copy files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install poetry
        run: pip install poetry

      - name: Install documentation dependencies
        run: poetry install --with doc --without dev

      - name: Build documentation
        run: poetry run mkdocs build --strict
