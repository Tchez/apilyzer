[tool.poetry]
name = "apilyzer"
version = "0.7.1"
description = "APIlyzer is a python library that aims to analyze the level of maturity of REST APIs, following the Richardson maturity model"
license = "MIT"
authors = ["Marco Antônio <marcomartins06@rede.ulbra.br>"]
readme = "README.md"
packages = [{ include = "apilyzer" }]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.10",
    "Intended Audience :: Developers",
]

[tool.poetry.urls]
"Documentation" = "https://apilyzer.readthedocs.io/en/latest/"
"Source Code" = "https://github.com/Tchez/apilyzer"
"Bug Tracker" = "https://github.com/Tchez/apilyzer/issues"


[tool.poetry.scripts]
apilyzer = "apilyzer.cli:app"


[tool.poetry.dependencies]
python = ">=3.10,<4.0"
httpx = ">=0.25,<0.29"
typer = ">=0.9,<0.24"
rich = ">=13.5.2,<16.0.0"


[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
pytest-cov = ">=4.1,<8.0"
black = ">=26.3.1,<27.0"
isort = ">=5.12,<7.0"
taskipy = "^1.12.0"


[tool.poetry.group.doc.dependencies]
mkdocs-material = "^9.3.1"
mkdocstrings = ">=0.23,<0.31"
mkdocstrings-python = "^1.7.0"
pymdown-extensions = ">=11.0.1,<12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--doctest-modules"

[tool.black]
line-length = 79
skip-string-normalization = true
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 79

[tool.taskipy.tasks]
lint = "black --check --diff . && isort --check --diff ."
docs = "mkdocs serve"
pre_test = "task lint"
test = "pytest -s -x --cov=apilyzer -vv"
post_test = "coverage html"
